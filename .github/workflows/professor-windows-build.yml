name: Windows Professor Build
on:
  push:
    branches: [main, feature/external-motion-keyframes, work/menus-arquivo-pdf-20261026, work/integracao-branches-20261026]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  professor-build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Restore Lazarus toolchain
        id: lazarus-cache
        uses: actions/cache/restore@v4
        with:
          path: C:\lazarus
          key: lazarus-3.0.0-fpc-3.2.2-win64-v1
      - name: Install pinned Lazarus with FPC
        if: steps.lazarus-cache.outputs.cache-hit != 'true'
        timeout-minutes: 8
        shell: pwsh
        run: |
          choco install lazarus --version=3.0.0 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Lazarus installation failed' }
      - name: Save Lazarus toolchain
        if: steps.lazarus-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:\lazarus
          key: lazarus-3.0.0-fpc-3.2.2-win64-v1
      - name: Inspect installed compiler
        shell: pwsh
        run: |
          $lazbuild = Get-Command lazbuild.exe -ErrorAction SilentlyContinue
          $lazarus = if ($lazbuild) { Split-Path $lazbuild.Source } else { 'C:\lazarus' }
          $compiler = Get-ChildItem (Join-Path $lazarus 'fpc') -Filter fpc.exe -Recurse | Where-Object { $_.FullName -match 'x86_64-win64' } | Select-Object -First 1 -ExpandProperty FullName
          if (-not $compiler) { throw 'FPC x86_64-win64 not found in Lazarus installation' }
          $cpu = (& $compiler -iTP).Trim()
          $os = (& $compiler -iTO).Trim()
          if ($cpu -ne 'x86_64' -or $os -ne 'win64') { throw "Expected Win64 compiler, found $cpu-$os" }
          & $compiler -iV
          Write-Output "Lazarus: $lazarus; compiler: $compiler ($cpu-$os)"
          "LAZARUS_HOME=$lazarus" >> $env:GITHUB_ENV
          "FPC_COMPILER=$compiler" >> $env:GITHUB_ENV
      - name: Fetch pinned ChatGPT component baseline
        uses: actions/checkout@v4
        with:
          repository: marcelomaurin/CHATGPT
          ref: 3c845b998c7c631c0608c12b766a04b39da13be1
          path: .deps/chatgpt-integration-baseline
          sparse-checkout: |
            pacote
            funcoes.pas
      - name: Fetch pinned Castle Game Engine
        shell: pwsh
        run: ./scripts/setup_castle.ps1
      - name: Build Professor Virtual
        shell: pwsh
        run: |
          ./scripts/build_professor.ps1 -Lazarus $env:LAZARUS_HOME -Compiler $env:FPC_COMPILER -Platform x86_64-win64 -ChatGPT .deps/chatgpt-integration-baseline
      - name: Build and run menu, document and PDF regressions
        shell: pwsh
        run: |
          foreach ($target in @('tests/presentation_pdf_tests.lpr', 'tests/assistant_menu_tests.lpr', 'tests/assistant_document_menu_tests.lpr', 'tests/assistant_config_tests.lpr', 'tests/voice_native_tests.lpr', 'tests/chrome_speech_tests.lpr', 'tests/presentation_flow_tests.lpr', 'tests/presentation_rag_tests.lpr', 'tests/presentation_rag_agent_tests.lpr', 'tests/app_checks.lpr', 'tests/vision_check.lpr', 'tests/reception_tests.lpr', 'tools/pva_tool.lpr')) {
            ./scripts/build_professor.ps1 -Lazarus $env:LAZARUS_HOME -Compiler $env:FPC_COMPILER -Platform x86_64-win64 -ChatGPT .deps/chatgpt-integration-baseline -Target $target
          }
          $fixture = Join-Path $PWD 'build/professor/pdf-output'
          foreach ($test in @('presentation_pdf_tests', 'assistant_menu_tests', 'assistant_document_menu_tests')) {
            $stdout = Join-Path $PWD "build/professor/$test-result.log"
            $stderr = Join-Path $PWD "build/professor/$test-error.log"
            $process = Start-Process -FilePath (Join-Path $PWD "build/professor/$test.exe") -ArgumentList ('"' + $fixture + '"') -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            if (-not $process.WaitForExit(120000)) {
              $process.Kill()
              throw "Test timed out: $test"
            }
            $process.WaitForExit()
            $log = Get-Content -LiteralPath $stdout -Raw
            Write-Output $log
            Get-Content -LiteralPath $stderr
            if ($process.ExitCode -ne 0 -or $log -notmatch 'PASS:') { throw "Test failed or did not finish: $test" }
          }
      - name: Validate integrated configuration, RAG and voice
        if: always()
        shell: pwsh
        run: python tests/run_branch_integration_checks.py build/professor
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: professor-menus-pdf-win64
          path: |
            build/professor/*-build.log
            build/professor/*-result.log
            build/professor/*-error.log
            build/professor/assistente.exe
            build/professor/pdf-output/*.pdf
          if-no-files-found: warn

