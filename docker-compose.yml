services:
  db:
    image: postgres:16-alpine
    container_name: assistente_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: assistente
      POSTGRES_PASSWORD: assistente
      POSTGRES_DB: assistente
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistente -d assistente"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data:
